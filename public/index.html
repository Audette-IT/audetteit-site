<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="assets/faviconlogo.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audette IT | Site Maintenance</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="description" content="Audette IT is currently undergoing maintenance. We'll be back shortly.">
    <style>
        :root {
            --bg-color: #0B0F14;
            --primary-color: #00B4FF;
            --text-color: #E6F1FF;
            --muted-color: #9FB3C8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .maintenance-card {
            max-width: 480px;
        }

        .logo-crop {
            width: 64px;
            height: 64px;
            overflow: hidden;
            border-radius: 8px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 24px rgba(0, 180, 255, 0.25);
        }

        .logo-crop img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.6);
            transform-origin: center 40%;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .text-highlight {
            color: var(--primary-color);
        }

        p {
            color: var(--muted-color);
            font-size: 1rem;
            line-height: 1.6;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
            box-shadow: 0 0 10px rgba(0, 180, 255, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        .maintenance-note {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--muted-color);
        }
    </style>
</head>

<body>
    <div class="maintenance-card">
        <div class="logo-crop">
            <img src="assets/logo.jpg" alt="Audette IT Logo">
        </div>
        <h1>We'll be right <span class="text-highlight">back</span></h1>
        <p>Audette IT is currently undergoing scheduled maintenance while we work on some improvements. Thanks for your patience.</p>
        <p class="maintenance-note"><span class="status-indicator"></span>Maintenance in progress</p>
    </div>
</body>

</html>
